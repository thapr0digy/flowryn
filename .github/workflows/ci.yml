name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, lint, test, build, fixtures
    # macOS is the v1 platform: launchd, codesign and the Unix socket path limit are tested for real.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      # tasks-axi is a Node CLI; the journal's tests run against the real, pinned version.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install tasks-axi
        run: npm install -g tasks-axi@0.2.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Build the signed binary
        run: bun run build

      - name: Cleanup-guard fixtures
        run: fixtures/cleanup-guard/run.sh
